name: Sincronizar bolões CAIXA

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar site
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sincronizar marketplace
        run: python scripts/sync_marketplace.py

      - name: Salvar atualização
        run: |
          git config user.name "Serra Loterias Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/boloes.json data/ultima_pagina.txt
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza bolões do Marketplace CAIXA"
          git push
