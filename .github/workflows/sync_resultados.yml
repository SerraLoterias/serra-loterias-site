name: Sincronizar resultados ConectaLot

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar site
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar resultados pela ConectaLot
        env:
          CONECTALOG_TOKEN: ${{ secrets.CONECTALOG_TOKEN }}
        run: python scripts/sync_resultados.py

      - name: Salvar atualização
        run: |
          git config user.name "Serra Loterias Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/resultados.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza resultados via ConectaLot"
          git push
